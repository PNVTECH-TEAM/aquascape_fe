name: Deploy to AWS S3

on:
  push:
    branches: ['main', 'feature/PNVTECH-93-ci/cd-fe']
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./aquascape_fe
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # - name: Eslint Check
      #   run: npm run lint

      - name: App Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: aquascape_fe/dist

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: aquascape_fe/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to AWS S3
        run:  | 
          aws s3 sync aquascape_fe/dist s3://aquascape-pnvtech --delete
          echo "🚀 Deployed to: http://aquascape-pnvtech.s3-website.eu-north-1.amazonaws.com"